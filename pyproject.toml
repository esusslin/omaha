[project]
name = "omaha"
version = "0.1.0"
description = "Document intelligence and agent layer for NFL prediction. Agents produce evidence, never probabilities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Emmet Susslin", email = "esusslin@gmail.com" }]

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # db
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # scheduling
    "apscheduler>=3.10,<4",
    # ingestion
    # NOTE: docling would be the nicer PDF parser, but it pulls torch, which has no
    # x86_64 macOS wheels. pdfplumber handles the practice-report tables fine and keeps
    # local dev installable. Revisit docling on the Linux server if layout gets hairy.
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "trafilatura>=2.0",
    "feedparser>=6.0",
    "selectolax>=0.3",
    # extraction (Phase 4) — pure python, no ML wheels, so it installs on the host too
    "anthropic>=0.40",
    # utils
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-python-dateutil",
]

# Embeddings are an OPTIONAL extra, installed only in the Linux container.
#
# Neither torch (past 2.2) nor onnxruntime (past ~1.19) ships x86_64 macOS wheels any
# more, so the local dev machine cannot run the model at all. Rather than pin ancient
# versions and pretend, embedding runs where it runs in production: linux/amd64.
#
#   docker compose run --rm worker python -m omaha.retrieve.run embed
#
# `uv sync --extra dev` stays installable on any host; only the container adds this.
embed = [
    "fastembed>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omaha"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type stubs. `fastembed` additionally isn't installed
# on the host at all — it lives behind the `embed` extra and only builds on Linux — so
# without this every host-side typecheck fails on an import that is *designed* to be
# absent. See `search_api.get_embedder` for how that absence is handled at runtime.
module = [
    "pdfplumber.*",
    "trafilatura.*",
    "feedparser.*",
    "pgvector.*",
    "apscheduler.*",
    "fastembed.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
